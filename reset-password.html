<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password – e-visa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header" id="navbar">
    <nav>
      <section class="navbar-inner" aria-label="Primary navigation">
        <div class="navbar-left">
          <a href="index.html" class="logo logo-with-seal">
            <img src="https://e-visa.al/img/logos/main.png" alt="e-visa" class="logo-img">
          </a>
        </div>
      </section>
    </nav>
  </header>

  <main class="fill-default-layout-height bg-gray-200">
    <section class="max-w-screen-xl mx-auto px-4 py-24">
      <article class="rounded-md border border-gray-400 p-8 max-w-md mx-auto bg-white shadow-sm">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Choose a new password</h1>
        <div id="reset-message" class="hidden mb-4 rounded-md px-4 py-3 text-sm" role="status"></div>
        <form id="reset-form" class="space-y-4">
          <div>
            <label for="new-password" class="block text-sm font-medium text-gray-700 mb-1">New password</label>
            <input id="new-password" type="password" required autocomplete="new-password"
              class="w-full border border-gray-400 rounded-md px-3 py-2 text-gray-900">
          </div>
          <div>
            <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Repeat password</label>
            <input id="confirm-password" type="password" required autocomplete="new-password"
              class="w-full border border-gray-400 rounded-md px-3 py-2 text-gray-900">
          </div>
          <button type="submit" id="reset-submit" class="w-full button button-secondary py-2.5 font-semibold rounded-md">
            Update password
          </button>
        </form>
      </article>
    </section>
  </main>

  <script src="evisa-supabase-config.js"></script>
  <script src="evisa-supabase-client.js"></script>
  <script>
    (function () {
      var form = document.getElementById('reset-form');
      var submit = document.getElementById('reset-submit');
      var message = document.getElementById('reset-message');
      var client = null;

      function showMessage(text, isError) {
        message.textContent = text;
        message.className =
          'mb-4 rounded-md px-4 py-3 text-sm ' +
          (isError ? 'border border-red-200 bg-red-50 text-red-800' : 'border border-green-200 bg-green-50 text-green-800');
      }

      (window.EvisaSupabaseReady || Promise.resolve(null)).then(function (supabase) {
        if (!supabase) throw new Error('The password recovery service is unavailable.');
        client = supabase;
        return client.auth.getSession();
      }).then(function (result) {
        if (result.error) throw result.error;
        if (!result.data.session) {
          form.classList.add('hidden');
          showMessage('This password reset link is invalid or has expired.', true);
        }
      }).catch(function (error) {
        form.classList.add('hidden');
        showMessage(error.message || 'This password reset link is invalid or has expired.', true);
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var password = document.getElementById('new-password').value;
        var confirmation = document.getElementById('confirm-password').value;
        if (password !== confirmation) {
          showMessage('Passwords do not match.', true);
          return;
        }
        if (!client) {
          showMessage('The password recovery session is unavailable.', true);
          return;
        }

        submit.disabled = true;
        submit.textContent = 'Updating…';
        client.auth.updateUser({ password: password }).then(function (result) {
          if (result.error) throw result.error;
          showMessage('Your password has been updated. You can now sign in.', false);
          form.reset();
          setTimeout(function () {
            window.location.replace('login.html');
          }, 1200);
        }).catch(function (error) {
          showMessage(error.message || 'Could not update the password.', true);
        }).finally(function () {
          submit.disabled = false;
          submit.textContent = 'Update password';
        });
      });
    })();
  </script>
</body>
</html>
